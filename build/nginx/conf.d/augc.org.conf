server {
    listen 80;
    root /var/www/symfony/web.augc.org/public;
    server_name augc.org;
    index index.php index.html;

    # ── SEGURIDAD ────────────────────────────────────────────
    fastcgi_hide_header X-Powered-By;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    server_tokens off;
    # ─────────────────────────────────────────────────────────

    # Bloquear acceso a ficheros sensibles
    location ~ /\.(git|env|htaccess) {
        deny all;
        return 404;
    }

    # Recursos estáticos — sin rate limiting, con caché
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg|webp|pdf|mp4|mp3)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Llamadas a la API - sin rate limiting
    location /api/ad/serve {
        try_files $uri /index.php$is_args$args;
        limit_req zone=general_rate burst=1000 nodelay;
        limit_conn conn_limit 1000;
    }

    # Pixel de tracking newsletter — sin rate limiting
    location /nl/t/ {
        try_files $uri /index.php$is_args$args;
        limit_req zone=general_rate burst=1000 nodelay;
        limit_conn conn_limit 1000;
    }

    # Páginas dinámicas — rate limiting moderado
    location / {
        limit_conn conn_limit 20;
        limit_req zone=general_rate burst=50 nodelay;
        try_files $uri /index.php$is_args$args;
    }

    # PHP — rate limiting estricto
    location ~ \.php$ {
        fastcgi_pass php3:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        limit_req zone=general_rate burst=50 nodelay;
        limit_conn conn_limit 10;
        fastcgi_read_timeout 60;
    }

    error_log /var/log/nginx/web.augc.org.error.log;
    access_log /var/log/nginx/web.augc.org.access.log;
}
