[www]
pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 10s
pm.max_requests = 100
pm.status_path = /fpm-status

request_terminate_timeout = 60s
;request_slowlog_timeout = 5s
;slowlog = /var/log/php-fpm/slowlog-www.log

catch_workers_output = yes
decorate_workers_output = no
